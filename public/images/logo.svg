<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-green-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="grad-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circular Arrows (Recycling & Tech Loop) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Right Arrow Segment -->
    <path d="M 250,50 A 180,180 0 0,1 420,210" stroke="url(#grad-green-teal)" stroke-width="28"/>
    <path d="M 428,218 L 410,180 L 445,190 Z" fill="url(#grad-green-teal)"/>

    <!-- Bottom-Right Arrow Segment -->
    <path d="M 425,260 A 180,180 0 0,1 250,430" stroke="url(#grad-green-teal)" stroke-width="28"/>
    <path d="M 242,438 L 280,420 L 270,455 Z" fill="url(#grad-green-teal)"/>

    <!-- Left Arrow Segment -->
    <path d="M 210,425 A 180,180 0 0,1 80,240" stroke="url(#grad-green-teal)" stroke-width="28"/>
    <path d="M 72,232 L 90,270 L 55,260 Z" fill="url(#grad-green-teal)"/>
    
    <!-- Top-Left Arrow Segment -->
    <path d="M 90,190 A 180,180 0 0,1 220,55" stroke="url(#grad-green-teal)" stroke-width="28"/>
    <path d="M 228,47 L 190,65 L 200,30 Z" fill="url(#grad-green-teal)"/>
  </g>

  <!-- Tech Nodes on Circle -->
  <circle cx="160" cy="115" r="10" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
  <circle cx="160" cy="385" r="10" fill="#ffffff" stroke="#0e7490" stroke-width="6"/>
  <circle cx="360" cy="350" r="10" fill="#ffffff" stroke="#0e7490" stroke-width="6"/>

  <!-- AI Brain Node Emblem (Top Right) -->
  <g transform="translate(350, 70) scale(0.9)">
    <circle cx="40" cy="40" r="45" fill="#ffffff" stroke="url(#grad-ai)" stroke-width="6" shadow="true"/>
    <!-- Brain & Circuit Details -->
    <path d="M 28,30 C 20,30 18,45 28,50 C 18,55 25,68 35,65 C 40,65 42,60 42,55" stroke="url(#grad-ai)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 52,30 C 60,30 62,45 52,50 C 62,55 55,68 45,65 C 40,65 38,60 38,55" stroke="url(#grad-ai)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <line x1="40" y1="25" x2="40" y2="65" stroke="url(#grad-ai)" stroke-width="4"/>
    <!-- AI Rays -->
    <line x1="40" y1="12" x2="40" y2="2" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="52" y1="15" x2="60" y2="7" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="15" x2="20" y2="7" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <text x="40" y="47" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#0f766e" text-anchor="middle">AI</text>
  </g>

  <!-- Central Leaf Emblem -->
  <g transform="translate(135, 130) scale(1.1)">
    <path d="M 30,170 C 20,90 80,30 170,20 C 170,110 110,170 30,170 Z" fill="url(#grad-leaf)"/>
    <path d="M 30,170 C 80,130 120,90 170,20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M 90,120 C 110,100 130,95 145,90" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 65,145 C 80,135 95,130 110,128" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
